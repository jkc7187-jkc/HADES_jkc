name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: APK 빌드
        run: |
          cd 20260430_HADES_STOCK_PRO_ANDROID_APK_PREMIUM_FINAL
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: HADES-STOCK-PRO-APK
          path: 20260430_HADES_STOCK_PRO_ANDROID_APK_PREMIUM_FINAL/app/build/outputs/apk/debug/app-debug.apk
    - name: 권한 부여
      run: chmod +x gradlew

    - name: APK 빌드
      run: run: cd 20260430_HADES_STOCK_PRO_ANDROID_APK_PREMIUM_FINAL && chmod +x gradlew && ./gradlew assembleDebug
    - name: APK 업로드
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: path: 20260430_HADES_STOCK_PRO_ANDROID_APK_PREMIUM_FINAL/app/build/outputs/apk/debug/app-debug.apk
