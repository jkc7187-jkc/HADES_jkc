name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build APK
        run: |
          cd "20260430_HADES_STOCK_PRO_ANDROID_APK_PREMIUM_FINAL"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HADES-STOCK-PRO-APK
          path: "20260430_HADES_STOCK_PRO_ANDROID_APK_PREMIUM_FINAL/app/build/outputs/apk/debug/app-debug.apk"debug.apk
