name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: |
          cd 20260430_HADES_STOCK_PRO_ANDROID_APK_PREMIUM_FINAL
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HADES-STOCK-PRO-APK
          path: 20260430_HADES_STOCK_PRO_ANDROID_APK_PREMIUM_FINAL/app/build/outputs/apk/debug/app-debug.apkname: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: |
          cd 20260430_HADES_STOCK_PRO_ANDROID_APK_PREMIUM_FINAL
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: 20260430_HADES_STOCK_PRO_ANDROID_APK_PREMIUM_FINAL/app/build/outputs/apk/debug/app-debug.apk
